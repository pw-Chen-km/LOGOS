<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Research Graph — Literature Intelligence</title>
    <meta name="description" content="Interactive research paper knowledge graph explorer with multi-dimensional filtering and cross-paper analysis.">
    <link rel="stylesheet" href="style.css">
    <script src="https://d3js.org/d3.v7.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
</head>
<body>

<!-- ═══ Top Navigation Bar ═══════════════════════════════════ -->
<nav class="topbar" id="topbar">
    <div class="topbar-brand">
        <span class="icon">🧬</span>
        <span>Research Graph</span>
    </div>
    <div class="topbar-nav" id="topbar-nav">
        <button class="active" data-view="dashboard" id="nav-dashboard">📊 Literature Library</button>
    </div>
    <div class="topbar-stats" id="topbar-stats">
        <span>Papers <span class="stat-value" id="stat-papers">-</span></span>
        <span>Entities <span class="stat-value" id="stat-entities">-</span></span>
        <span>Relations <span class="stat-value" id="stat-relations">-</span></span>
    </div>
</nav>

<!-- ═══ App Container ════════════════════════════════════════ -->
<div class="app-container" id="app">

    <!-- ─── View 1: Dashboard ─────────────────────────────── -->
    <div class="view active" id="view-dashboard">
        <div class="dashboard-layout">
            <!-- Filter Sidebar -->
            <aside class="filter-sidebar" id="filter-sidebar">
                <h3>🏷️ Keyword Filters</h3>
                <input type="text" class="filter-search" id="keyword-search" placeholder="Search keywords…">
                <div class="keyword-list" id="keyword-list">
                    <!-- filled by JS -->
                </div>
                <div class="filter-actions">
                    <button class="btn-filter primary" id="btn-apply-filter" onclick="applyFilters()">Apply</button>
                    <button class="btn-filter ghost" id="btn-clear-filter" onclick="clearFilters()">Clear</button>
                </div>
            </aside>

            <!-- Papers Grid -->
            <main class="papers-grid-container" id="papers-main">
                <div class="papers-grid-header">
                    <h2>All Papers</h2>
                    <span class="result-count" id="result-count"></span>
                </div>
                <div class="papers-grid" id="papers-grid">
                    <!-- filled by JS -->
                </div>
            </main>
        </div>
    </div>

    <!-- ─── View 2 & 3: Paper Detail (Anatomy + Network) ── -->
    <div class="view" id="view-paper">
        <div class="anatomy-header" id="anatomy-header">
            <button class="back-btn" id="btn-back" onclick="showDashboard()">← Back to Library</button>
            <h1 id="paper-title-display"></h1>
            <div class="meta-row" id="paper-meta-row"></div>
        </div>
        <div class="anatomy-tabs" id="anatomy-tabs">
            <button class="active" data-tab="anatomy" id="tab-anatomy" onclick="switchPaperTab('anatomy')">🔬 Paper Anatomy</button>
            <button data-tab="network" onclick="switchPaperTab('network')">
                🧭 Paper Exploration
            </button>
        </div>

        <!-- Tab: Anatomy -->
        <div class="anatomy-content" id="tab-content-anatomy" style="height: calc(100vh - 200px); overflow-y: auto;">
            <div id="anatomy-card-container" style="max-width:900px; margin:0 auto; padding:32px 24px;">
                <!-- filled by renderAnatomyCard() in app.js -->
                <div class="anatomy-loading">
                    <div class="spinner"></div>
                </div>
            </div>
        </div>


        <!-- Tab: Network (Paper Exploration) -->
        <div class="anatomy-content" id="tab-content-network" style="height: calc(100vh - 200px); display: none; overflow-y: auto; background: var(--bg-primary);">
            <div id="exploration-container" style="max-width:1100px; margin:0 auto; padding:32px 24px; width: 100%;">
                <!-- Hub paper and multi-connection related papers rendered here -->
            </div>
        </div>
    </div>
</div>

<div class="node-tooltip" id="node-tooltip"></div>

<script src="app.js?v=6"></script>
</body>
</html>
